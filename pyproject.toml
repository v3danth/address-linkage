[project]
name = "address-linkage"
version = "0.1.0"
description = "Link people by where they live, with the Amazon ML Challenge entity-resolution pipeline"
requires-python = ">=3.9"
dependencies = [
    "polars==1.33.1",
    "rapidfuzz==3.14.1",
    "anyascii==0.3.3",
    "numpy==2.0.2",
    "lightgbm==4.6.0",
    "torch==2.4.0",
    "transformers==4.46.0",
    "pymysql==1.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.7.1",
]

[tool.ruff]
line-length = 140
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.pytest.ini_options]
testpaths = ["tests"]
